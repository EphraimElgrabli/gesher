name: Bug report
description: Something doesn't work, or broke after a macOS update.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove personal data (names, notes, events, addresses) from anything you paste.
        Security problems: use [private reporting](https://github.com/EphraimElgrabli/gesher/security/advisories/new) instead.
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: "Apple menu > About This Mac, or `sw_vers -productVersion`."
      placeholder: "27.0"
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: App
      options: [Reminders, Calendar, Contacts, Notes, Maps, Weather, Freeform, Installer / gesher connect, Other]
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: AI app
      description: Which AI app runs Gesher, if any.
      placeholder: Claude Desktop, Claude Code, Codex, Cursor, CLI only…
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked for (the prompt or command), what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: gesher doctor
      description: "Output of `gesher doctor` (or `<app>-cli doctor`)."
      render: text
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error output
      description: The error JSON or message, if there was one.
      render: text
